<svg width="600" height="180" viewBox="0 0 600 180" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Product Knowledge</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5F02"/>
      <stop offset="50%" stop-color="#AE5A5F"/>
      <stop offset="100%" stop-color="#3053F4"/>
    </linearGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5F02"/>
      <stop offset="50%" stop-color="#AE5A5F"/>
      <stop offset="100%" stop-color="#3053F4"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="32" y="82" width="536" height="60"/>
    </clipPath>
    <style>
      @keyframes flip-docs {
        0%         { transform: translateY(60px); }
        2%         { transform: translateY(0px); }
        11%        { transform: translateY(0px); }
        13%        { transform: translateY(-60px); }
        100%       { transform: translateY(-60px); }
      }
      @keyframes flip-skills {
        0%         { transform: translateY(60px); }
        11%        { transform: translateY(60px); }
        13%        { transform: translateY(0px); }
        22%        { transform: translateY(0px); }
        24%        { transform: translateY(-60px); }
        100%       { transform: translateY(-60px); }
      }
      @keyframes flip-content {
        0%         { transform: translateY(60px); }
        22%        { transform: translateY(60px); }
        24%        { transform: translateY(0px); }
        33%        { transform: translateY(0px); }
        35%        { transform: translateY(-60px); }
        100%       { transform: translateY(-60px); }
      }
      @keyframes flip-context {
        0%         { transform: translateY(60px); }
        33%        { transform: translateY(60px); }
        35%        { transform: translateY(0px); }
        44%        { transform: translateY(0px); }
        46%        { transform: translateY(-60px); }
        100%       { transform: translateY(-60px); }
      }
      @keyframes flip-localization {
        0%         { transform: translateY(60px); }
        44%        { transform: translateY(60px); }
        46%        { transform: translateY(0px); }
        55%        { transform: translateY(0px); }
        57%        { transform: translateY(-60px); }
        100%       { transform: translateY(-60px); }
      }
      @keyframes flip-knowledge {
        0%         { transform: translateY(60px); }
        55%        { transform: translateY(60px); }
        57%        { transform: translateY(0px); }
        96%        { transform: translateY(0px); }
        100%       { transform: translateY(60px); }
      }
      .w { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1); }
      .docs         { animation-name: flip-docs; }
      .skills       { animation-name: flip-skills; }
      .content      { animation-name: flip-content; }
      .context      { animation-name: flip-context; }
      .localization { animation-name: flip-localization; }
      .knowledge    { animation-name: flip-knowledge; }
    </style>
  </defs>

  <!-- Gradient background -->
  <rect width="600" height="180" rx="12" fill="url(#bg)"/>

  <!-- Subtle dark overlay to deepen bg so text pops -->
  <rect width="600" height="180" rx="12" fill="#00233C" opacity="0.72"/>

  <!-- Static "product" -->
  <text x="32" y="76"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="42" font-weight="300" fill="#ffffff" letter-spacing="-0.5">product</text>

  <!-- Flip slot -->
  <g clip-path="url(#clip)">
    <text class="w docs" x="32" y="130"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-0.5"
      style="transform: translateY(60px)">quick starts</text>

    <text class="w skills" x="32" y="130"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-0.5"
      style="transform: translateY(60px)">best practices</text>

    <text class="w content" x="32" y="130"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-0.5"
      style="transform: translateY(60px)">integrations</text>

    <text class="w context" x="32" y="130"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-0.5"
      style="transform: translateY(60px)">demos</text>

    <text class="w localization" x="32" y="130"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="42" font-weight="600" fill="#ffffff" letter-spacing="-0.5"
      style="transform: translateY(60px)">deep dives</text>

    <text class="w knowledge" x="32" y="133"
      font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="46" font-weight="800" fill="#FF5F02" letter-spacing="-1"
      style="transform: translateY(60px)">developer guides</text>
  </g>

  <!-- Gradient underline -->
  <rect x="32" y="152" width="290" height="4" rx="2" fill="url(#underline)"/>

  <!-- Orange dot -->
  <circle cx="330" cy="154" r="3" fill="#FF5F02"/>

  <!-- Teradata wordmark scaled to 14px tall, white fill -->
  <g transform="translate(340, 147) scale(0.7)">
    <path d="M0 2.30155H3.63859V5.66123H7.69681V8.88018H3.63859V14.5069C3.63859 15.9629 4.39343 16.4388 5.45788 16.4388H7.69681V19.6578H5.45788C1.73485 19.6578 0 18.0355 0 14.5069V2.30155Z" fill="#FF5F02"/>

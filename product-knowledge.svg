    <path d="M58.0178 19.6552V18.7315L57.8233 18.8159C56.5363 19.4326 55.1648 19.7396 53.8496 19.7396C50.3517 19.7396 47.2709 17.4726 47.2709 12.6595C47.2709 7.84643 50.3491 5.5512 53.8777 5.5512C55.1648 5.5512 56.5363 5.85826 57.8233 6.47492L57.9359 6.53122V0.341525H61.5745V19.6552H58.0178ZM54.52 16.38C55.3029 16.38 56.1704 16.1829 57.0659 15.7633L57.9334 15.3437V9.97022L57.0659 9.55058C56.1704 9.13094 55.3029 8.93391 54.52 8.93391C52.5036 8.93391 50.994 10.1928 50.994 12.6569C50.994 15.121 52.5062 16.38 54.52 16.38Z" fill="#FF5F02"/>
    <path d="M68.1506 19.8215C65.5765 19.8215 63.532 18.3093 63.532 15.1748C63.532 12.6006 65.1543 10.8376 68.7928 10.8376H71.9555V10.418C71.9555 9.13094 71.1444 8.59871 69.128 8.59871C67.7847 8.59871 66.7202 8.73945 65.2643 9.15909V5.88385C66.385 5.57679 67.7847 5.37977 69.4351 5.37977C73.634 5.37977 75.5915 6.97389 75.5915 10.418V19.6552H72.0374V18.8441L71.2262 19.1793C70.1899 19.5989 69.128 19.8241 68.148 19.8241L68.1506 19.8215ZM70.1388 16.5463L71.9581 15.7633V13.6932H69.1869C67.928 13.6932 67.1706 14.2818 67.1706 15.2055C67.1706 16.2981 67.9254 16.8278 68.8773 16.8278C69.2688 16.8278 69.7166 16.7152 70.1362 16.5488L70.1388 16.5463Z" fill="#FF5F02"/>
    <path d="M78.2808 2.30155H81.9194V5.66123H85.9776V8.88018H81.9194V14.5069C81.9194 15.9629 82.6742 16.4388 83.7387 16.4388H85.9776V19.6578H83.7387C80.0157 19.6578 78.2808 18.0355 78.2808 14.5069V2.30155Z" fill="#FF5F02"/>
    <path d="M91.8551 19.8215C89.281 19.8215 87.2365 18.3093 87.2365 15.1748C87.2365 12.6006 88.8588 10.8376 92.4974 10.8376H95.66V10.418C95.66 9.13094 94.8489 8.59871 92.8326 8.59871C91.4892 8.59871 90.4248 8.73945 88.9688 9.15909V5.88385C90.0896 5.57679 91.4892 5.37977 93.1396 5.37977C97.3386 5.37977 99.2961 6.97389 99.2961 10.418V19.6552H95.7419V18.8441L94.9308 19.1793C93.8945 19.5989 92.8326 19.8241 91.8526 19.8241L91.8551 19.8215ZM93.8433 16.5463L95.6626 15.7633V13.6932H92.8914C91.6325 13.6932 90.8751 14.2818 90.8751 15.2055C90.8751 16.2981 91.63 16.8278 92.5818 16.8278C92.9733 16.8278 93.4211 16.7152 93.8408 16.5488L93.8433 16.5463Z" fill="#FF5F02"/>
    <path d="M101.399 18.0585C101.399 16.9941 102.239 16.1548 103.331 16.1548C104.424 16.1548 105.263 16.9941 105.263 18.0585C105.263 19.123 104.396 19.9904 103.331 19.9904C102.267 19.9904 101.399 19.123 101.399 18.0585Z" fill="#FF5F02"/>
  </g>

</svg>
